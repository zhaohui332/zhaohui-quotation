services:
  zhaohui-quotation:
    image: ghcr.io/zhaohui332/zhaohui-quotation:latest
    pull_policy: always
    container_name: zhaohui-quotation
    restart: unless-stopped
    ports:
      - "4731:4731"
    environment:
      - PORT=4731
      - ZHAOHUI_PYTHON=python3
    volumes:
      - ./zhaohui-data/data:/app/data
      - ./zhaohui-data/assets:/app/素材
      - ./zhaohui-data/out:/app/out
